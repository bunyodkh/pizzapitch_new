# Nginx server block for PizzaPitch — reverse proxies to Gunicorn over a
# unix socket, and serves /static/ and /media/ directly (faster than routing
# them through Django, and matches STATIC_ROOT/MEDIA_ROOT in config/settings.py).
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/pizzapitch
#   sudo ln -s /etc/nginx/sites-available/pizzapitch /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then run certbot (see DEPLOY.md) — it edits this file in place to add the
# HTTPS server block and the HTTP->HTTPS redirect.
#
# Replace example.com and the /home/pizzapitch/app paths below to match your
# domain and droplet layout if you didn't follow DEPLOY.md exactly.

server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 10M;

    location /static/ {
        alias /home/pizzapitch/app/staticfiles/;
    }

    location /media/ {
        alias /home/pizzapitch/app/media/;
    }

    location / {
        proxy_pass http://unix:/run/pizzapitch/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
