{% load i18n %}{% get_current_language as CUR_LANG %}
<form action="{% url 'set_language' %}" method="post" class="langsw">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="en" class="langbtn{% if CUR_LANG == 'en' %} active{% endif %}">EN</button>
  <button type="submit" name="language" value="ru" class="langbtn{% if CUR_LANG == 'ru' %} active{% endif %}">RU</button>
</form>
